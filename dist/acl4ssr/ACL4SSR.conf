[General]
# Name: ACL4SSR 静态配置（proxy-providers 版）
# Author: A11255
# 配置来源: 同目录的 clash.yaml
#
# 这份配置是 ACL4SSR_Online_Full.ini 的原样翻译：
#   29 个策略组、33 条规则，组名和规则顺序一个字都没改。
#   规则集的 URL 从 raw.githubusercontent.com 换成了 jsDelivr（否则国内拉不动）。
#
# 与 ACL4SSR 官方用法的区别：
#   官方需要 subconverter 后端把「订阅 + .ini」合成一份配置；
#   这里用 mihomo 原生的 proxy-providers，订阅地址直接写进 provider，
#   不需要任何转换服务，也不经过第三方。
#
# 模块变量: EN_KEY1 = 节点订阅链接
#
# 注意：不要和其他配置模块同时启用，它们都写 CONFIG_FILE 和订阅设置，
# 后执行的会覆盖先执行的。

DOWNLOAD_FILE = url=https://cdn.jsdelivr.net/gh/A11255/flclash-ruleset@main/dist/acl4ssr/clash.yaml, path=/etc/openclash/config/ACL4SSR.yaml, force=true
CONFIG_FILE = /etc/openclash/config/ACL4SSR.yaml
SUB_INFO_URL = $EN_KEY1
RESTART = true

[Overwrite]
# 把订阅地址写进 proxy-providers.sub.url
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "sub" "['url']" "$EN_KEY1"
