    url: "https://cdn.jsdelivr.net/gh/A11255/flclash-ruleset@main/dist/mihomo/AdBlock_Domain.yaml"
    path: ./providers/AdBlock_Domain.yaml
    interval: 86400
  AdBlock_IP:
    type: http
