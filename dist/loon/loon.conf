[General]
internet-test-url = http://www.gstatic.com/generate_204
proxy-test-url = http://www.gstatic.com/generate_204
test-timeout = 5
geoip = true

[Proxy Group]
节点选择 = select,PROXY,DIRECT

[Rule]
# 上游规则走 jsDelivr 镜像，避免 iOS 直连 raw.githubusercontent.com 超时
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,100.66.1.0/24,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
RULE-SET,https://cdn.jsdelivr.net/gh/Code-Dramatist/Rule_Actions@main/Reject_Rule/Reject_Rule.rule,REJECT
RULE-SET,https://cdn.jsdelivr.net/gh/Code-Dramatist/Rule_Actions@main/Direct_Rule/Direct_Rule.rule,DIRECT
RULE-SET,https://cdn.jsdelivr.net/gh/Code-Dramatist/Rule_Actions@main/Proxy_Rule/Proxy_Rule.rule,节点选择
GEOIP,CN,DIRECT
FINAL,节点选择
