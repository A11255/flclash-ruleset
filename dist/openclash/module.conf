# +rules = 插入到数组开头，所以这里的顺序就是优先级
# 本段只使用 DIRECT / REJECT 两个内建出站，不依赖任何自定义策略组名，
# 因此不管你用哪套 OpenClash 模板都不会因为「找不到策略组」而加载失败。
+rules:
  - 'GEOIP,LAN,DIRECT,no-resolve'
  - 'GEOIP,private,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,169.254.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,100.66.1.0/24,DIRECT,no-resolve'
  - 'IP-CIDR,100.64.0.0/10,DIRECT,no-resolve'
  - 'IP-CIDR6,::1/128,DIRECT,no-resolve'
  - 'IP-CIDR6,fc00::/7,DIRECT,no-resolve'
  - 'IP-CIDR6,fe80::/10,DIRECT,no-resolve'
  - 'RULE-SET,Reject_Rule_KW,REJECT'
  - 'RULE-SET,rejectAd_KW,REJECT'
  - 'RULE-SET,Direct_Rule_KW,DIRECT'
  - 'RULE-SET,Reject_Rule,REJECT'
  - 'RULE-SET,AdBlock,REJECT'
  - 'RULE-SET,adrules,REJECT'
  - 'RULE-SET,rejectAd,REJECT'
  - 'RULE-SET,Adblock4limbo,REJECT'
  - 'RULE-SET,apple_update,DIRECT'
  - 'RULE-SET,Google_FCM,DIRECT'
  - 'RULE-SET,Apple_Push,DIRECT'
  - 'RULE-SET,Direct_Rule,DIRECT'
  - 'RULE-SET,Reject_Rule_IP,REJECT,no-resolve'
  - 'RULE-SET,AdBlock_IP,REJECT,no-resolve'
  - 'RULE-SET,rejectAd_IP,REJECT,no-resolve'
  - 'RULE-SET,Google_FCM_IP,DIRECT,no-resolve'
  - 'RULE-SET,Apple_Push_IP,DIRECT,no-resolve'
  - 'RULE-SET,Direct_Rule_IP,DIRECT,no-resolve'

# ── 以下需要自定义策略组，默认不启用 ──────────────────────────
# 你的 OpenClash 里没有名为「节点选择」的策略组，所以这部分先注释掉。
# 不启用也不影响分流：没被上面规则命中的流量会落到配置末尾的 MATCH，
# 那个目标本来就是代理组（你日志里是 🐟 漏网之鱼），效果一致。
#
# 确实要启用：去掉下面 3 行的 # ，
# 并把「你的代理策略组」换成策略组页面里真实存在的名字。
#  - 'RULE-SET,Proxy_Rule_KW,你的代理策略组'
#  - 'RULE-SET,Proxy_Rule,你的代理策略组'
#  - 'RULE-SET,Proxy_Rule_IP,你的代理策略组,no-resolve'

dns:
  # 内网域名走真实解析，否则输入路由后台/NAS 主机名会拿到 198.18.x.x
  fake-ip-filter+:
    - '+.lan'
    - '+.local'
    - '+.localdomain'
    - '+.home.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'

tun:
  route-exclude-address+:
    - '100.64.0.0/10'
