#!NAME=规则中心 · OpenClash
#!DESC=广告拦截 + 内网/组网直连 + 国内直连兜底。规则文件由 CDN 下发，自动跟随上游更新。
#!CONFIG=all
#!CRON=0 4 * * *

[General]
# 显式指定 WAN 区域名，修复「设置仅允许内网功能失败，无法获取 IPv4 的 WAN 接口名称」
INTRANET_ALLOWED_WAN_NAME = wan
# 域名嗅探：实测加上它会导致内核启动卡在第五步（16:13 / 16:17 两次失败），已停用。
# 想启用就删掉下面这行的 # 号。你的订阅已有 GeoSite(cn) 和 Custom_* 规则，不依赖嗅探。
# ENABLE_META_SNIFFER = 1
# 本模块内容更新（CRON 拉到新版）后自动重启插件，否则新规则不会加载
RESTART = true

[YAML]
# ============================================================
# 规则中心 · OpenClash 端
# 自动生成，请勿手改。改 sources.json 后由 CI 重建。
# 与 FlClash / Loon 端各自独立：这里用的是 OpenClash 的策略组与插件能力。
# ============================================================

