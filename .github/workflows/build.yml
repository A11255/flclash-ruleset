name: build

on:
  push:
    paths:
      - 'upstreams.txt'
      - 'sources.json'
      - 'tools/build.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 dist
        run: node tools/build.js

      - name: 校验产物
        run: |
          set -euo pipefail
          node --check dist/flclash-override.js

          n=$(ls dist/mihomo/*.yaml 2>/dev/null | wc -l)
          echo "rule-provider yaml: $n 个"
          [ "$n" -ge 1 ]

          # 覆写脚本里引用的每个 yaml 必须真实存在且非空，否则 FlClash 端会拉 404
          grep -oE '"[A-Za-z0-9_]+\.yaml"' dist/flclash-override.js \
            | tr -d '"' | sort -u > /tmp/refs.txt
          echo "覆写脚本引用 $(wc -l < /tmp/refs.txt) 个 provider"
          missing=0
          while read -r f; do
            [ -s "dist/mihomo/$f" ] || { echo "::error::缺少 provider 文件 $f"; missing=1; }
          done < /tmp/refs.txt
          [ "$missing" -eq 0 ]
          echo "provider 引用全部存在"

          # 单端仓库：别的端着陆目录不应该再出现
          [ ! -e dist/loon ] && [ ! -e dist/openclash ]
          echo "产物目录: $(ls dist | tr '\n' ' ')"

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --staged --quiet; then
            echo "产物无变化"
          else
            git commit -m "chore: rebuild dist from upstreams.txt"
            git push
          fi
