# 纯 YAML 覆写模块：不加 [General]（会干扰启动），不加 #! 元信息（不被识别）。
# 匹配配置文件请在界面上选 all；更新时间请手动填 0 4 * * *。

[YAML]
# ============================================================
# 规则中心 · OpenClash 端
# 自动生成，请勿手改。改 sources.json 后由 CI 重建。
# 与 FlClash / Loon 端各自独立：这里用的是 OpenClash 的策略组与插件能力。
# ============================================================

