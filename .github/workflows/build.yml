name: build

on:
  push:
    paths:
      - 'upstreams.txt'
      - 'sources.json'
      - 'tools/build.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 dist
        run: node tools/build.js

      - name: 生成 ACL4SSR 静态配置
        run: |
          set -euo pipefail
          # 上游模板每次 CI 重新拉，保证跟着 ACL4SSR 的更新走
          curl -fsSL --retry 3 -o /tmp/ACL4SSR_Online_Full.ini \
            https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_Full.ini
          mkdir -p dist/acl4ssr
          node tools/build-acl4ssr.js /tmp/ACL4SSR_Online_Full.ini dist/acl4ssr/clash.yaml

      - name: 下载 mihomo 内核
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.20/mihomo-linux-amd64-v1.19.20.gz
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: 生成 .mrs 规则集
        run: |
          set -euo pipefail
          # build.js 已把待转换的表和清单写进 _upstream/，这里只负责调内核
          # convert-ruleset 只支持 domain / ipcidr，classical（关键词表）会 panic，
          # 所以关键词规则不进 mrs，OpenClash 那边用 yaml 引。
          n=0
          while IFS=$'\t' read -r behavior src dst; do
            [ -z "${behavior:-}" ] && continue
            mkdir -p "$(dirname "$dst")"
            /tmp/mihomo convert-ruleset "$behavior" yaml "$src" "$dst"
            [ -s "$dst" ] || { echo "::error::转换失败 $dst"; exit 1; }
            n=$((n+1))
          done < _upstream/mrs-todo.tsv
          echo "转换完成 $n 个 .mrs"
          du -sh dist/openclash

      - name: 校验产物
        run: |
          set -euo pipefail
          node --check dist/flclash-override.js

          n=$(ls dist/mihomo/*.yaml 2>/dev/null | wc -l)
          echo "rule-provider yaml: $n 个"
          [ "$n" -ge 1 ]

          # 覆写脚本里引用的每个 yaml 必须真实存在且非空，否则 FlClash 端会拉 404
          grep -oE '"[A-Za-z0-9_]+\.yaml"' dist/flclash-override.js \
            | tr -d '"' | sort -u > /tmp/refs.txt
          echo "覆写脚本引用 $(wc -l < /tmp/refs.txt) 个 provider"
          missing=0
          while read -r f; do
            [ -s "dist/mihomo/$f" ] || { echo "::error::缺少 provider 文件 $f"; missing=1; }
          done < /tmp/refs.txt
          [ "$missing" -eq 0 ]
          echo "provider 引用全部存在"

          # Loon 规则集：每个 group 一个 .rule，不能是空文件，
          # 且不能只有注释头（说明分类结果为空，规则没进来）
          r=0
          for f in dist/loon/*.rule; do
            [ -e "$f" ] || continue
            r=$((r+1))
            body=$(grep -cvE '^\s*(#|$)' "$f" || true)
            echo "  $(basename "$f")  $body 条"
            [ "$body" -gt 0 ] || { echo "::error::$f 里没有任何规则"; exit 1; }
          done
          echo "Loon 规则集: $r 个"
          [ "$r" -ge 1 ]

          # OpenClash 的 .mrs：清单里每一个都要有产物，且 mrs 是二进制
          # （首 4 字节不是 payload:，防止把 yaml 改名冒充）
          m=$(ls dist/openclash/*.mrs 2>/dev/null | wc -l)
          todo=$(grep -c . _upstream/mrs-todo.tsv || true)
          echo "OpenClash .mrs: $m 个（清单 $todo 个）"
          [ "$m" -eq "$todo" ]
          for f in dist/openclash/*.mrs; do
            [ -s "$f" ] || { echo "::error::$f 是空文件"; exit 1; }
            head -c 7 "$f" | grep -q 'payload:' && { echo "::error::$f 不是 mrs，看起来是 yaml"; exit 1; }
          done
          echo "mrs 全部有效"

          echo "产物目录: $(ls dist | tr '\n' ' ')"

          # ACL4SSR 配置：组数和规则数对得上，且订阅占位符还在
          # （占位符被换成真地址说明有人手改了产物，应该改模板而不是改产物）
          g=$(grep -c '^  - name:' dist/acl4ssr/clash.yaml)
          r=$(sed -n '/^rules:/,$p' dist/acl4ssr/clash.yaml | grep -c '^  - ')
          echo "ACL4SSR: $g 个策略组 / $r 条规则"
          [ "$g" -ge 20 ] || { echo "::error::策略组太少，模板解析可能出错"; exit 1; }
          [ "$r" -ge 25 ] || { echo "::error::规则太少，模板解析可能出错"; exit 1; }
          grep -q 'SUBSCRIPTION_URL' dist/acl4ssr/clash.yaml \
            || { echo "::error::订阅占位符丢了，模块会填不进去"; exit 1; }
          echo "ACL4SSR 产物校验通过"

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --staged --quiet; then
            echo "产物无变化"
          else
            git commit -m "chore: rebuild dist from upstreams.txt"
            git push
          fi
